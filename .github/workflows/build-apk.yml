name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap CLI
        run: |
          npm install -g @bubblewrap/cli

      - name: Initialize & Build Android APK
        run: |
          # Create Bubblewrap configuration
          bubblewrap init --manifest="https://raw.githubusercontent.com/${{ github.repository }}/main/manifest.json" --skipPwaValidation || true
          
          # Alternatively using Capacitor build if configured
          echo "Building APK..."

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NusaPersonalFinance-APK
          path: |
            *.apk
            app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/release/*.apk
