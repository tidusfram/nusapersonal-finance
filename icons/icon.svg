<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Outer subtle border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#334155" stroke-width="4" opacity="0.6"/>

  <!-- Decorative glow circles -->
  <circle cx="150" cy="150" r="120" fill="#10b981" opacity="0.15" filter="url(#glow)"/>
  <circle cx="360" cy="360" r="140" fill="#6366f1" opacity="0.15" filter="url(#glow)"/>

  <!-- Shield / Wallet Shape Base -->
  <g transform="translate(106, 106)">
    <!-- Shield / Diamond Emblem -->
    <path d="M150 16 L270 70 L270 170 C270 240 150 290 150 290 C150 290 30 240 30 170 L30 70 Z" 
          fill="url(#primary)" opacity="0.2" stroke="#10b981" stroke-width="6"/>

    <!-- Central Rupiah & Growth Chart -->
    <!-- Growth Bars -->
    <rect x="75" y="170" width="26" height="55" rx="6" fill="#10b981"/>
    <rect x="115" y="140" width="26" height="85" rx="6" fill="#34d399"/>
    <rect x="155" y="110" width="26" height="115" rx="6" fill="#6ee7b7"/>
    <rect x="195" y="80" width="26" height="145" rx="6" fill="#10b981"/>

    <!-- Trending Arrow -->
    <path d="M70 150 L120 120 L160 90 L220 50" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="220,38 232,58 208,58" fill="#ffffff" transform="rotate(45 220 50)"/>

    <!-- Letter N for Nusa -->
    <path d="M60 210 L60 80 L140 180 L140 80" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
  </g>

  <!-- App Title text -->
  <text x="256" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="2">
    NUSA<tspan fill="#10b981">FINANCE</tspan>
  </text>
</svg>
